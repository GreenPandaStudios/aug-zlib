name: Publish reviewed native package
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  actions: read
concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Select reviewed candidate run
        id: candidate
        run: |
          node --input-type=module <<'AUG_RUN'
          import assert from 'node:assert/strict';
          import {appendFileSync,readFileSync} from 'node:fs';
          const manifest=JSON.parse(readFileSync('aug-package.json'));
          const plan=JSON.parse(readFileSync('release-candidates.json'));
          assert.equal(process.env.GITHUB_REF_NAME,'v'+manifest.version);
          assert.equal(plan.version,manifest.version);
          assert.ok(Number.isSafeInteger(plan.runId)&&plan.runId>0);
          appendFileSync(process.env.GITHUB_OUTPUT,'run='+plan.runId+'\n');
          AUG_RUN
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          run-id: ${{ steps.candidate.outputs.run }}
          github-token: ${{ github.token }}
          pattern: native-candidate-*
          path: .aug-build/reviewed
      - name: Verify source contracts and assemble exact archives
        run: node scripts/prepare-native-package-release.mjs .aug-build/reviewed
      - name: Publish only the verified archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-native-package-release.mjs
